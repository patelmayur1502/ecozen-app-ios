name: Build EcoZen iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Pre-built xtool for macOS
        run: |
          curl -fL "https://github.com/xtool-org/xtool/releases/download/1.24.0/xtool.app.zip" -o xtool.zip
          unzip -q xtool.zip
          sudo rm -rf /Applications/xtool.app
          sudo cp -R xtool.app /Applications/
          sudo xattr -cr /Applications/xtool.app
          sudo tee /usr/local/bin/xtool << 'EOF'
          #!/bin/bash
          exec /Applications/xtool.
