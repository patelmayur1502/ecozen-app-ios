name: Build EcoZen iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.0.app

      - name: Install xtool
        run: |
          git clone https://github.com/xtool-org/xtool.git
          cd xtool
          swift build -c release
          sudo cp .build/release/xtool /usr/local/bin/

      - name: Build EcoZen App & Generate IPA
        run: |
          xtool dev build --ipa
          mkdir -p build_output
          find . -name "*.ipa" -exec cp {} build_output/EcoZen.ipa \;

      - name: Upload EcoZen.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EcoZen-iOS-IPA
          path: build_output/EcoZen.ipa
          retention-days: 7
